<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Openings</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
    }

    .card {
      background: #fff;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      min-height: 100vh;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 2px solid #f0f0f0;
      border-radius: 10px;
      padding: 10px;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .form-logo {
      height: 50px;
    }

    .job-list,
    .job-details,
    .job-form {
      margin-bottom: 20px;
    }

    .job-list ul {
      list-style: none;
      padding: 0;
    }

    .job-list li {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .job-list li:hover {
      background: #f9f9f9;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .col {
      flex: 1;
      min-width: 300px;
    }

    .upload-preview img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    textarea {
      resize: vertical;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      background: #0056b3;
    }

    .small-link {
      display: block;
      text-align: right;
      font-size: 12px;
      margin-bottom: 10px;
    }

    @media (max-width: 768px) {
      .row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="form-header">
      <img src="https://v2retail.com/wp-content/uploads/2024/10/V2-Logo-1.png" alt="Logo" class="form-logo" />
      <div style="font-size: 20px; font-weight: 600;">Job Openings</div>
    </div>

        </div>

        <p>

        <p>
        <div>Location:</div> <span id="jobLocation"></span>
        </p>
        <p>

        </p>
        <ul id="responsibilitiesList"></ul>
        <p>

        </p>
        <ul id="skillsList"></ul>
      </div>

              </div>
              <input type="file" name="profilePhoto" accept="image/*" onchange="previewImage(event)"
                style="margin-top: 10px;" />
            </div> -->

            <div class="col" style="flex: 2; min-width: 250px;">
              <div class="form-group" style="margin-bottom: 15px;">

                </div>

            </div>
          </div>

          <div class="form-group" style="margin-bottom: 15px;">

          </div>

          <div class="row" style="display: flex; flex-wrap: wrap; gap: 20px;">
            <div class="col form-group" style="flex: 1; min-width: 200px;">
              <label>Age</label>
              <input type="number" name="age" required

            </div>
            <div class="col form-group" style="flex: 1; min-width: 200px;">
              <label>Phone</label>

            </div>
            <div class="col form-group" style="flex: 1; min-width: 200px;">

            </div>
            <div class="col form-group" style="flex: 1; min-width: 200px;">
              <label>Previous Company</label>
              <input type="text" name="previousCompany"

            </div>
            <div class="col form-group" style="flex: 1; min-width: 200px;">

            </div>
            <div class="col form-group" style="flex: 1; min-width: 200px;">
              <label>Previous Salary</label>
              <input type="text" name="previousSalary"

            </div>
            <div class="col form-group" style="flex: 1; min-width: 200px;">
              <label>Total Experience (Years)</label>
              <input type="number" name="experience"
                style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;" />
            </div>
            <div class="col form-group" style="flex: 1; min-width: 200px;">
              <label>Salary Expectation</label>
              <input type="text" name="expectedSalary"
                style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;" />
            </div>
          </div>

          <div class="form-group" style="margin: 20px 0;">
            <label>Cover Letter / Notes</label>
            <textarea name="coverLetter" rows="4"
              style="width: 100%; padding: 12px; resize: vertical; border-radius: 6px; border: 1px solid #ccc;"></textarea>
          </div>

        </form>
      </div>

  <script>
    function showJobDetails(title, location, experience, qualification, responsibilities, skills, Designation, Locations) {
      // console.log('test---------->', title, location, experience, qualification, responsibilities, skills);

      // document.getElementById('jobDetails').style.display = 'block';
      document.getElementById('jobDetails').style.display = 'block';
      document.getElementById('job-form').style.display = 'none';
      document.getElementById('jobTitle').innerText = title;
      document.getElementById('jobLocation').innerText = location;
      document.getElementById('jobExperience').innerText = experience;
      // document.getElementById('jobQualification').innerText = qualification;

      const respList = document.getElementById('responsibilitiesList');
      respList.innerHTML = '';
      responsibilities?.forEach(item => {
        const li = document.createElement('li');
        li.innerText = item;
        respList.appendChild(li);
      });


      const skillList = document.getElementById('skillsList');
      skillList.innerHTML = '';
      skills?.forEach(item => {
        const li = document.createElement('li');
        li.innerText = item;
        skillList.appendChild(li);
      });


      const select = document.getElementById('jobPosition');

      Designation?.forEach(item => {
        const option = document.createElement('option');
        option.value = item.designationId;
        option.textContent = item.designationName;
        select.appendChild(option);
      });

      const selectt = document.getElementById('locationPosition');

      Locations?.forEach(item => {
        const option = document.createElement('option');
        option.value = item.locationId;
        option.textContent = item.locationName;
        selectt.appendChild(option);
      });

      


    }

    function previewImage(event) {
      const reader = new FileReader();
      reader.onload = function () {
        const img = document.createElement('img');
        img.src = reader.result;
        const container = document.getElementById('uploadPreview');
        container.innerHTML = '';
        container.appendChild(img);
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function submitForm(event) {
      event.preventDefault();

      const form = event.target;
      const formData = new FormData(form);
      formData.append("IsApplicant", true);
      formData.append("isResumeAttachmentUploaded", true)

      // for (let [key, value] of formData.entries()) {
      //   if (value instanceof File) {
      //     console.log(`📎 File field: ${key}`);
      //     console.log(`   ▶ Name: ${value.name}`);
      //     console.log(`   ▶ Type: ${value.type}`);
      //     console.log(`   ▶ Size: ${value.size} bytes`);
      //     console.log(`   ▶ File object:`, value);
      //   } else {
      //     console.log(`${key}: ${value}`);
      //   }
      // }

      fetch('https://v2parivar.v2retail.com:9987/api/Applicant', {
        method: 'POST',
        body: formData,
      })
        .then(response => response.json())
        .then(data => {
          // console.log('Success:', data);
          alert('Form submitted successfully!');
          form.reset(); // clear form after success
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Error submitting form. Please try again.');
        });
    }

    function applyjob() {
      document.getElementById('jobDetails').style.display = 'none';
      document.getElementById('job-form').style.display = 'block';
      document.getElementById('job-form').scrollIntoView({ behavior: 'smooth' });
    }

    function goBack() {
      document.getElementById('jobDetails').style.display = 'block';
      document.getElementById('job-list').style.display = 'block';
      document.getElementById('job-form').style.display = 'none';
    }

    function fetchJobs() {
      fetch('https://v2parivar.v2retail.com:9987/api/JobOpening') // Use your actual API URL here
        .then(response => response.json())
        .then(data => populateJobList(data))
        .catch(error => {
          console.error("Failed to fetch jobs:", error);
          populateJobList(mockJobs); // fallback to mock
        });
    }

    function populateJobList(jobs) {
      const container = document.getElementById('jobListContainer');
      container.innerHTML = '';

      jobs.forEach((job, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
        <div>${job.designationName}</div>
        <small style="color: #007bff;">Apply Now →</small>
      `;
        li.onclick = () => showJobDetails(
          job.designationName,
          job.locationName,
          job.experience || "5 years",
          job.qualification || '12th',
          job.responsibilities || [
            "Develop and maintain web applications using React and Node.js",
            "Collaborate with UI/UX designers to implement design into code",
            "Write clean, scalable, and efficient code",
            "Participate in code reviews and provide constructive feedback",
            "Troubleshoot, debug, and upgrade existing software",
            "Stay up to date with emerging technologies and frameworks"
          ],
          job.skills || [
            "JavaScript",
            "React",
            "Node.js",
            "CSS3",
            "HTML5",
            "Git",
            "REST APIs",
            "TypeScript"
          ],
          Designation,
          Locations

        );
        container.appendChild(li);
      });
    }
